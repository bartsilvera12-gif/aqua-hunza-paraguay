<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | Aqua Hunza Paraguay</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:#fff;padding:32px;
    background:linear-gradient(158deg,#134256 0%,#0C2530 100%)}
  .box{max-width:560px}
  img{height:70px;width:auto;filter:brightness(0) invert(1);margin-bottom:34px}
  .code{font-family:Manrope,system-ui,sans-serif;font-weight:800;font-size:clamp(64px,14vw,120px);
    line-height:1;letter-spacing:-.04em;color:#4FD0E8}
  h1{font-family:Manrope,system-ui,sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,32px);
    margin:14px 0 0;letter-spacing:-.02em}
  p{color:#C3D6DF;font-size:17px;line-height:1.7;margin:18px auto 0;max-width:44ch}
  .actions{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  a.btn{display:inline-flex;align-items:center;font-weight:600;font-size:15.5px;padding:15px 30px;
    border-radius:999px;transition:transform .25s ease,background .25s ease,color .25s ease}
  a.primary{background:#279CBC;color:#fff}
  a.primary:hover{background:#fff;color:#0C2530;transform:translateY(-2px)}
  a.ghost{border:1.5px solid rgba(255,255,255,.4);color:#fff}
  a.ghost:hover{background:#fff;color:#0C2530}
</style>
</head>
<body>
  <div class="box">
    <img src="/logo-aqua-hunza.png" alt="Aqua Hunza Paraguay">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscás no existe o fue movida. Volvé al inicio o escribinos y te ayudamos.</p>
    <div class="actions">
      <a class="btn primary" href="/index.html">Ir al inicio</a>
      <a class="btn ghost" href="/contacto.html">Contacto</a>
    </div>
  </div>
</body>
</html>
